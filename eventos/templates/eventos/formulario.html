{% extends 'core/base.html' %}

{% block titulo %}Nuevo evento · Gestión de Eventos{% endblock %}

{% block contenido %}
    <h1>Nuevo evento</h1>

    <form class="formulario tarjeta" method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <div class="acciones">
            <button type="submit">Guardar evento</button>
            <a class="boton secundario" href="{% url 'eventos:lista' %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
